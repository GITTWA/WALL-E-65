# 1. RISOLUZIONE CRASH HARDWARE SUI CLONI SUPERMINI
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# 2. POTENZA SEGNALE BLUETOOTH AL MASSIMO (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 3. VELOCITÀ BLUETOOTH ULTRA-RAPIDA (Bassa latenza: 7.5ms - 15ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# 4. RISPARMIO ENERGETICO: DEEP SLEEP DOPO 15 MINUTI (900.000 ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_PM_DEVICE=y

# 5. GESTIONE BATTERIA E ZMK STUDIO
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# 6. GESTIONE LED SUL PIN P1.01 (Spento all'avvio e spegnimento in standby)
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
